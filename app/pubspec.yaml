name: zhiyue
description: 智阅 - 面向深度阅读/学习者的开源 Flutter 电子书阅读平台
publish_to: 'none'
version: 1.4.0-alpha+0

environment:
  sdk: ^3.10.0
  flutter: ^3.27.0

dependencies:
  flutter:
    sdk: flutter

  # 状态管理
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # 路由
  go_router: ^14.2.0

  # 数据库
  drift: ^2.18.0
  sqlite3: ^2.9.0
  sqlite3_flutter_libs: ^0.5.24

  # 文件系统
  path: ^1.9.0
  path_provider: ^2.1.4
  file_picker: ^8.1.2

  # 工具
  uuid: ^4.4.2
  collection: ^1.18.0
  crypto: ^3.0.5
  meta: ^1.15.0
  reorderables: ^0.6.0

  # M2 阅读引擎
  reader_engine:
    path: ../reader_engine
  reader_engine_epub_view:
    path: ../reader_engine_epub_view
  reader_engine_pdf_view:
    path: ../reader_engine_pdf_view

  # M2 阅读引擎底层依赖（M1.5a：BookTextExtractor 直接使用 epubx + pdfrx）
  epubx:
    path: ../epubx_patched
  pdfrx: ^2.3.0

  # M2.0a: sync
  http: ^1.2.0
  flutter_secure_storage: ^9.2.2

  # M2.0b: connectivity_plus for offline detection
  connectivity_plus: ^6.0.5

  # i18n
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.0
  url_launcher: ^6.3.2

dependency_overrides:
  # M4: epubx 4.0.0 pins image ^3.0.8 AND passes List<int> to
  # decodeImage (incompatible with image 4.x). pdfrx_engine 0.4.3
  # needs image 4.x API (ChannelOrder.bgra, getBytes(order:)).
  # Local fork patches decodeImage to accept List<int> via
  # Uint8List.fromList + widens image constraint. Remove when
  # upstream epubx publishes image 4.x-compatible release.
  epubx:
    path: ../epubx_patched
  image: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # 代码生成
  build_runner: ^2.4.11
  drift_dev: ^2.18.0
  riverpod_generator: ^2.4.3
  custom_lint: ^0.7.6
  riverpod_lint: ^2.3.13

  # 静态分析
  flutter_lints: ^4.0.0

  # Golden 测试
  golden_toolkit: ^0.15.0

  # M7: 应用图标 pipeline
  flutter_launcher_icons: ^0.14.3

  # M7: mocktail for BookOpenBridge / MethodChannel tests
  mocktail: ^1.0.0

  flutter_widget_from_html: any
flutter:
  uses-material-design: true
  generate: true
