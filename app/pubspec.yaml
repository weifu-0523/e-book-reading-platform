name: zhiyue
description: 智阅 - 面向深度阅读/学习者的开源 Flutter 电子书阅读平台
publish_to: 'none'
version: 1.13.5-alpha

environment:
  sdk: ^3.10.0
  flutter: ^3.27.0

dependencies:
  flutter:
    sdk: flutter

  # 状态管理
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # 路由
  go_router: ^14.2.0

  # 数据库
  drift: ^2.18.0
  sqlite3: ^2.9.0
  sqlite3_flutter_libs: ^0.5.24

  # 文件系统
  path: ^1.9.0
  path_provider: ^2.1.4
  # S3/T10: pinned to 10.3.3–10.3.8 range — 10.3.3 introduced flutter.compileSdkVersion
  # (gives us compileSdk 36 default), but 10.3.9 silently removed FilePicker.platform
  # (breaking API change). 10.3.8 is the highest safe version with old API intact.
  file_picker: ">=10.3.3 <10.3.9"

  # 工具
  uuid: ^4.4.2
  collection: ^1.18.0
  crypto: ^3.0.5
  meta: ^1.15.0
  reorderables: ^0.6.0
  # M4.5: Markdown → HTML 转换（md/txt 书籍加载器用）
  markdown: ^7.0.0
  # 2026-07-09 BUG 1: AI 回复 markdown 渲染
  flutter_markdown: ^0.7.0

  # M2 阅读引擎
  reader_engine:
    path: ../reader_engine
  reader_engine_epub_view:
    path: ../reader_engine_epub_view
  reader_engine_pdf_view:
    path: ../reader_engine_pdf_view

  # M2 阅读引擎底层依赖（M1.5a：BookTextExtractor 直接使用 epubx + pdfrx）
  epubx:
    path: ../epubx_patched
  pdfrx: ^2.3.0

  # M2.0a: sync
  http: ^1.2.0
  # S3/T10: bumped to ^10.0.0 — 10.x targets SDK 36 (no sed patch needed)
  flutter_secure_storage: ^10.0.0

  # M2.0b: connectivity_plus for offline detection
  # S3/T10: bumped to ^7.0.0 — 7.x defaults to compileSdk 36 (no sed patch needed)
  connectivity_plus: ^7.0.0

  # i18n
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.0
  url_launcher: ^6.3.2

  # M2.5/T9: 桌面端全屏模式（windows/macos/linux）
  window_manager: ^0.4.3

  # TTS/T1: 朗读（P1 AI 消息 + EPUB 章节）
  flutter_tts: ^4.1.0

dependency_overrides:
  # M4: epubx 4.0.0 pins image ^3.0.8 AND passes List<int> to
  # decodeImage (incompatible with image 4.x). pdfrx_engine 0.4.3
  # needs image 4.x API (ChannelOrder.bgra, getBytes(order:)).
  # Local fork patches decodeImage to accept List<int> via
  # Uint8List.fromList + widens image constraint. Remove when
  # upstream epubx publishes image 4.x-compatible release.
  epubx:
    path: ../epubx_patched
  image: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # 代码生成
  build_runner: ^2.4.11
  drift_dev: ^2.18.0
  riverpod_generator: ^2.4.3
  custom_lint: ^0.7.6
  riverpod_lint: ^2.3.13

  # 静态分析
  flutter_lints: ^4.0.0

  # Golden 测试
  golden_toolkit: ^0.15.0

  # M7: 应用图标 pipeline
  flutter_launcher_icons: ^0.14.3

  # M7: mocktail for BookOpenBridge / MethodChannel tests
  mocktail: ^1.0.0

  flutter_widget_from_html: any
flutter:
  uses-material-design: true
  generate: true

  # M3a/任务5 + M3e/Q3: 打包开源/免费商用中文字体。
  # 字体文件不入 git（体积大，见 .gitignore + scripts/download-fonts.sh），
  # 首次拉取后跑 `bash scripts/download-fonts.sh` 获取。
  # family 名为逻辑别名（与 typography_panel.dart 的 fontFamily 值一致），
  # 不必与字体内部 post 表 name 完全相同。
  # 字体来源（OFL 或免费商用协议）：
  #   Noto Sans SC（思源黑体）— Google Noto CJK，SubsetOTF/SC 单字重（OFL 1.1）
  #   Noto Serif SC（思源宋体）— Google Noto CJK，SubsetOTF/SC 单字重（OFL 1.1）
  #   LXGW WenKai（霞鹜文楷）— LXGW 官方，单字重（OFL 1.1）
  #   Alibaba PuHuiTi（阿里巴巴普惠体）— 阿里巴巴，全球永久免费商用（M3e/Q3 新增）
  #   LXGW Neo XiHei（霞鹜新晰黑）— LXGW，IPA 衍生（OFL 1.1）（M3e/Q3 新增）
  fonts:
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC-Regular.otf
    - family: NotoSerifSC
      fonts:
        - asset: assets/fonts/NotoSerifSC-Regular.otf
    - family: LXGWWenKai
      fonts:
        - asset: assets/fonts/LXGWWenKai-Regular.ttf
    - family: AlibabaPuHuiTi
      fonts:
        - asset: assets/fonts/Alibaba-PuHuiTi-Regular.ttf
    - family: LXGWNeoXiHei
      fonts:
        - asset: assets/fonts/LXGWNeoXiHei.ttf
