name: zhiyue
description: 智阅 - 面向深度阅读/学习者的开源 Flutter 电子书阅读平台
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.10.0
  flutter: ^3.27.0

dependencies:
  flutter:
    sdk: flutter

  # 状态管理
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # 路由
  go_router: ^14.2.0

  # 数据库
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24

  # 文件系统
  path: ^1.9.0
  path_provider: ^2.1.4
  file_picker: ^8.1.2

  # 工具
  uuid: ^4.4.2
  collection: ^1.18.0
  crypto: ^3.0.5
  meta: ^1.15.0

  # M2 阅读引擎
  reader_engine:
    path: ../reader_engine
  reader_engine_epub_view:
    path: ../reader_engine_epub_view

  # i18n
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # 代码生成
  build_runner: ^2.4.11
  drift_dev: ^2.18.0
  riverpod_generator: ^2.4.3
  custom_lint: ^0.7.6
  riverpod_lint: ^2.3.13

  # 静态分析
  flutter_lints: ^4.0.0

  # Golden 测试
  golden_toolkit: ^0.15.0

flutter:
  uses-material-design: true
  generate: true
